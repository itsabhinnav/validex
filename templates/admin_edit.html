{% extends "base.html" %}

{% block title %}{{ 'Add' if mode == 'add' else 'Edit' }} Test Case{% endblock %}

{% block content %}
<div class="row">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1><i class="fas fa-{{ 'plus' if mode == 'add' else 'edit' }}"></i> {{ 'Add' if mode == 'add' else 'Edit' }} Test Case</h1>
      <a href="{{ url_for('admin_panel') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h5>{{ filename or 'Select a file on Admin page' }}</h5>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('admin_add') if mode == 'add' else url_for('admin_edit') }}">
          <input type="hidden" name="file" value="{{ filename }}">

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Test Case ID</label>
              <input class="form-control" name="test_id" value="{{ test_case.get('Test Case ID','') }}" {{ 'readonly' if mode=='edit' }} required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Title</label>
              <input class="form-control" name="title" value="{{ test_case.get('Test Case Title','') }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Feature</label>
              <input class="form-control" name="feature" value="{{ test_case.get('Feature','') }}">
            </div>
            <div class="col-md-4">
              <label class="form-label">Priority</label>
              <select class="form-select" name="priority">
                {% for p in ['High','Medium','Low'] %}
                <option value="{{p}}" {% if test_case.get('Priority')==p %}selected{% endif %}>{{p}}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select class="form-select" name="status">
                {% for s in ['Pending','Passed','Failed','Running','Blocked','Skipped'] %}
                <option value="{{s}}" {% if test_case.get('Status')==s %}selected{% endif %}>{{s}}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Preconditions</label>
              <textarea class="form-control" rows="2" name="preconditions">{{ test_case.get('Preconditions','') }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Given</label>
              <textarea class="form-control" rows="2" name="given">{{ test_case.get('Given','') }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">When</label>
              <textarea class="form-control" rows="2" name="when">{{ test_case.get('When','') }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Then</label>
              <textarea class="form-control" rows="2" name="then">{{ test_case.get('Then','') }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Expected Behavior</label>
              <textarea class="form-control" rows="2" name="expected">{{ test_case.get('Expected Behavior','') }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Remarks</label>
              <textarea class="form-control" rows="2" name="remarks">{{ test_case.get('Remarks','') }}</textarea>
            </div>
          </div>

          <div class="d-grid gap-2 mt-3">
            <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> {{ 'Add' if mode=='add' else 'Save Changes' }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card">
      <div class="card-header">
        <h6>Quick Edit by ID</h6>
      </div>
      <div class="card-body">
        <form method="GET" action="{{ url_for('admin_edit') }}">
          <input type="hidden" name="file" value="{{ filename }}">
          <div class="input-group">
            <input class="form-control" name="id" placeholder="Enter Test Case ID">
            <button class="btn btn-outline-secondary" type="submit">Load</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
