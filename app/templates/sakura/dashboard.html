{% extends "sakura_base.html" %}

{% block title %}Sakura Dashboard - Test Automation Platform{% endblock %}

{% block content %}
<div class="container-fluid mt-4">

    <!-- Requirements Overview -->
    <div class="row mb-3">
        <div class="col-lg-4 col-md-12 mb-2">
            <div class="card border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1 text-dark" id="total-requirements">0</h4>
                            <small class="text-muted">Total Requirements</small>
                        </div>
                        <div>
                            <i class="fas fa-list-check fa-2x text-muted"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="row">
        <!-- Requirements Management -->
        <div class="col-lg-8 mb-3">
            <div class="card">
                <div class="card-header py-2">
                    <h6 class="mb-0"><i class="fas fa-list-check me-2"></i>Requirements Management</h6>
                </div>
                <div class="card-body py-3">
                    <div class="d-grid gap-2">
                        <a href="{{ url_for('sakura.browse_requirements') }}" class="btn btn-outline-dark">
                            <i class="fas fa-search me-2"></i>Browse Requirements
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
{% endblock %}

{% block scripts %}
<style>
.card {
    border-radius: 8px;
    border: 1px solid #e9ecef;
    transition: all 0.3s ease;
}

.card:hover {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.requirement-item {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    transition: background-color 0.3s ease;
}

.requirement-item:hover {
    background-color: #f8f9fa;
}

.requirement-item:last-child {
    border-bottom: none;
}

.badge-sm {
    font-size: 0.7em;
    padding: 0.25em 0.5em;
}

.btn-xs {
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
}
</style>
