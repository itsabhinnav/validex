<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Selector - Test Management Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}?v=17.0" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            
            <div class="text-center mb-5">
            </div>

            <div class="row g-4">
                
                <div class="col-md-6">
                    <div class="card h-100 shadow-lg border-0 app-card" onclick="selectApp('validex', event)">
                        <div class="card-body text-center p-5">
                            <div class="mb-4">
                                <div class="app-icon validex-icon">
                                    <a href="{{ url_for('main.dashboard') }}" class="text-decoration-none">
                                        <i class="fas fa-clipboard-check fa-3x text-primary"></i>
                                    </a>
                                </div>
                            </div>
                            <h3 class="card-title fw-bold text-dark mb-3">Validex</h3>
                            <button class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-arrow-right me-2"></i>Launch
                            </button>
                        </div>
                    </div>
                </div>

                {% if sakura_enabled %}
                <div class="col-md-6">
                    <div class="card h-100 shadow-lg border-0 app-card" onclick="selectApp('sakura', event)">
                        <div class="card-body text-center p-5">
                            <div class="mb-4">
                                <div class="app-icon sakura-icon">
                                    <a href="{{ url_for('sakura.sakura_dashboard') }}" class="text-decoration-none">
                                        <i class="fas fa-spa fa-3x" style="color: #ff69b4;"></i>
                                    </a>
                                </div>
                            </div>
                            <h3 class="card-title fw-bold text-dark mb-3">Sakura</h3>
                            <button class="btn btn-success btn-lg w-100">
                                <i class="fas fa-arrow-right me-2"></i>Launch
                            </button>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="col-md-6">
                    <div class="card h-100 shadow-lg border-0 app-card disabled-feature">
                        <div class="card-body text-center p-5">
                            <div class="mb-4">
                                <div class="app-icon sakura-icon">
                                    <i class="fas fa-spa fa-3x" style="color: #ccc;"></i>
                                </div>
                            </div>
                            <h3 class="card-title fw-bold text-muted mb-3">Sakura</h3>
                            <button class="btn btn-secondary btn-lg w-100" disabled>
                                <i class="fas fa-clock me-2"></i>Coming Soon
                            </button>
                            <small class="text-muted d-block mt-2">Requirements management system</small>
                        </div>
                    </div>
                </div>
                {% endif %}
            </div>

        </div>
    </div>
</div>

<form id="appSelectionForm" method="POST" action="{{ url_for('main.select_app') }}" style="display: none;">
    <input type="hidden" id="selectedApp" name="selected_app" value="">
</form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>

.app-card {
    transition: all 0.3s ease;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid #e9ecef;
}

.app-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.app-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    transition: all 0.3s ease;
}

.validex-icon {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.sakura-icon {
    background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
    color: white;
}

.app-card:hover .app-icon {
    transform: scale(1.05);
}

.btn {
    border-radius: 5px;
    font-weight: 500;
}

/* Animation for page load */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.app-card {
    animation: fadeInUp 0.6s ease-out;
}

.app-card:nth-child(2) {
    animation-delay: 0.2s;
}
</style>

<script>
function selectApp(appName, event) {
    console.log('Selected app:', appName);

    const cards = document.querySelectorAll('.app-card');
    cards.forEach(card => {
        card.style.opacity = '0.5';
        card.style.transform = 'scale(0.95)';
    });

    const selectedCard = event ? event.currentTarget : event.target;
    if (selectedCard) {
        selectedCard.style.opacity = '1';
        selectedCard.style.transform = 'scale(1.05)';
        selectedCard.style.boxShadow = '0 25px 50px rgba(0, 0, 0, 0.25)';
    }

    const selectedAppInput = document.getElementById('selectedApp');
    if (selectedAppInput) {
        selectedAppInput.value = appName;
        console.log('Set selectedApp value to:', appName);
    } else {
        console.error('selectedApp input not found!');
    }

    const button = selectedCard ? selectedCard.querySelector('button') : null;
    if (button) {
        const originalText = button.innerHTML;
        button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Loading...';
        button.disabled = true;
    }

    const form = document.getElementById('appSelectionForm');
    if (form) {
        console.log('Submitting form with app:', appName);
        form.submit();
    } else {
        console.error('appSelectionForm not found!');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const cards = document.querySelectorAll('.app-card');
    
    cards.forEach(card => {
        card.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-10px)';
        });
        
        card.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
        });
    });
});
</script>
</body>
</html>
