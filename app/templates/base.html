<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Validex - Test Case Management Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand text-dark" href="{{ url_for('main.index') }}">
                <i class="fas fa-clipboard-check"></i> Validex
            </a>
            
            {% if current_role %}
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3 text-dark">
                    <i class="fas fa-user"></i> 
                    <span class="role-badge badge bg-secondary">{{ current_role.title() if current_role else 'Guest' }}</span>
                </span>
                <a class="nav-link text-dark" href="{{ url_for('main.dashboard') }}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                {% if current_role == 'tester' %}
                    <a class="nav-link text-dark" href="{{ url_for('main.test_cases') }}">
                        <i class="fas fa-list"></i> Test Cases
                    </a>
                    <a class="nav-link text-dark" href="{{ url_for('main.reports') }}">
                        <i class="fas fa-chart-bar"></i> Reports
                    </a>
                {% elif current_role == 'admin' %}
                    <a class="nav-link text-dark" href="{{ url_for('main.admin') }}">
                        <i class="fas fa-cog"></i> Admin
                    </a>
                    <a class="nav-link text-dark" href="{{ url_for('main.jfrog_config') }}">
                        <i class="fas fa-cloud"></i> JFrog
                    </a>
                {% endif %}
                <a class="nav-link text-dark" href="{{ url_for('main.logout') }}">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js temporarily disabled -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script> -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
